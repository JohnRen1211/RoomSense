<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ROOMS Table Update</title>
  <link rel="icon" href="/images/favicon.ico" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-gray-300 text-gray-700">
  <div class="flex h-screen">
    <!-- Main Content -->
    <div class="flex-1 bg-gray-100 ml-16 p-6">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-600">ROOMS</h1>
      </div>

      <div class="flex space-x-6">
        <!-- Room Buttons -->
        <div class="bg-white shadow-md rounded-lg p-4 w-48">
          <h2 class="text-lg text-orange-500 font-bold mb-4">Rooms in CPE</h2>
          <div class="space-y-2">
            <button onclick="updateRoomStatus('300', event)" class="border px-3 py-2 w-full rounded">ROOM 300</button>
            <button onclick="updateRoomStatus('310', event)" class="border px-3 py-2 w-full rounded">ROOM 310</button>
            <button onclick="updateRoomStatus('311', event)" class="border px-3 py-2 w-full rounded">ROOM 311</button>
            <button onclick="updateRoomStatus('312', event)" class="border px-3 py-2 w-full rounded">ROOM 312</button>
            <button onclick="updateRoomStatus('313', event)" class="border px-3 py-2 w-full rounded">ROOM 313</button>
            <button onclick="updateRoomStatus('314', event)" class="border px-3 py-2 w-full rounded">ROOM 314</button>
            <button onclick="updateRoomStatus('315', event)" class="border px-3 py-2 w-full rounded">ROOM 315</button>
            <button onclick="updateRoomStatus('316', event)" class="border px-3 py-2 w-full rounded">ROOM 316</button>
          </div>
        </div>

        <!-- Room Details -->
        <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-xl">
          <h2 class="text-xl text-orange-500 font-bold mb-4">Room Details</h2>
          <div class="space-y-4">
            <div class="mb-4">
              <label for="overrideStatus" class="block text-sm font-medium text-gray-700">Manual Room Action</label>
              <select id="overrideStatus" onchange="manualOverrideChanged()" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm">
                <option value="auto">Auto (Based on Schedule)</option>
                <option value="enter">Enter Room</option>
                <option value="leave">Leave Room</option>
              </select>
            </div>

            <div class="flex justify-between"><span class="font-medium">Room Status</span><span id="room-status" class="font-bold">UNKNOWN</span></div>
            <div class="flex justify-between"><span class="font-medium">Room Number</span><span id="room-no" class="font-semibold">N/A</span></div>
            <div class="flex justify-between"><span class="font-medium">Section</span><span id="occupied-by" class="font-semibold">N/A</span></div>
            <div class="flex justify-between"><span class="font-medium">Subject</span><span id="room-type-details" class="font-semibold">N/A</span></div>
            <div class="flex justify-between"><span class="font-medium">Professor</span><span id="instructor" class="font-semibold">N/A</span></div>
            <div class="flex justify-between"><span class="font-medium">Schedule</span><span id="room-schedule" class="font-semibold">N/A</span></div>
            <div class="flex justify-between items-start">
              <div class="font-medium flex flex-col">
                <span>Scanned In</span>
                <span class="text-xs text-gray-500">*Only available in Room 315</span>
              </div>
              <span id="scan-status" class="font-semibold flex items-center gap-2">
                <span id="scan-indicator" class="w-3 h-3 rounded-full bg-gray-400 inline-block"></span>
                <span id="scan-label">No scan</span>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const supabaseClient = supabase.createClient(
    'https://vzubmycafgnjtwnjfpop.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dWJteWNhZmduanR3bmpmcG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNDY2NTQsImV4cCI6MjA1OTkyMjY1NH0.fDzlvR0xT3Sm8BTlCnEbxC8WE8-H3ZBRxA9SeEViaeo'
  );

  let manualOverrides = {};
  let currentRoom = null;

  function manualOverrideChanged() {
    const value = document.getElementById("overrideStatus").value;
    if (currentRoom) {
      manualOverrides[currentRoom] = value;
      updateRoomStatus(currentRoom);
    }
  }

  async function updateRoomStatus(room, event) {
    currentRoom = room;

    const elements = {
      roomStatus: document.getElementById("room-status"),
      roomNo: document.getElementById("room-no"),
      roomType: document.getElementById("room-type-details"),
      schedule: document.getElementById("room-schedule"),
      section: document.getElementById("occupied-by"),
      instructor: document.getElementById("instructor"),
      scanIndicator: document.getElementById("scan-indicator"),
      scanLabel: document.getElementById("scan-label")
    };

    resetScanIndicator();

    document.querySelectorAll("button").forEach(btn => btn.classList.remove("bg-orange-100"));
    if (event) event.target.classList.add("bg-orange-100");

    elements.roomStatus.textContent = 'LOADING...';
    elements.roomStatus.style.color = 'gray';

    document.getElementById("overrideStatus").value = manualOverrides[room] || 'auto';

    const { data, error } = await supabaseClient
      .from('schedules_test')
      .select('*')
      .eq('room', room);

    if (error) {
      console.error('Schedule fetch error:', error);
      elements.roomStatus.textContent = 'Error loading schedule';
      elements.roomStatus.style.color = 'red';
      return;
    }

    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
    let currentSchedule = null;

    for (const schedule of data || []) {
      const start = new Date(new Date(schedule.start_time).toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
      const end = new Date(new Date(schedule.end_time).toLocaleString('en-US', { timeZone: 'Asia/Manila' }));

      if (start <= now && now <= end) {
        currentSchedule = schedule;
        break;
      }
    }

    const override = manualOverrides[room] || 'auto';

    if (override === 'leave') {
      displayRoomStatus('AVAILABLE 📘', 'green', room, null);
    } else if (override === 'enter') {
      displayRoomStatus('OCCUPIED', 'red', room, null);
    } else if (currentSchedule) {
      displayRoomStatus('OCCUPIED', 'red', room, currentSchedule);
      if (room === '315') await checkFingerprintScan(currentSchedule);
    } else {
      displayRoomStatus('AVAILABLE', 'green', room, null);
    }

    function displayRoomStatus(status, color, room, schedule) {
      elements.roomStatus.textContent = status;
      elements.roomStatus.style.color = color;
      elements.roomNo.textContent = `ROOM ${room}`;
      elements.roomType.textContent = schedule?.subject || 'N/A';
      elements.schedule.textContent = schedule ? `${formatTime(schedule.start_time)} - ${formatTime(schedule.end_time)}, ${new Date(schedule.date).toLocaleDateString()}` : 'N/A';
      elements.section.textContent = schedule?.section || 'N/A';
      elements.instructor.textContent = schedule?.prof || 'N/A';
    }

    function resetScanIndicator() {
      elements.scanIndicator.className = 'w-3 h-3 rounded-full bg-gray-400 inline-block';
      elements.scanLabel.textContent = 'No scan';
    }

    async function checkFingerprintScan(schedule) {
      const { data: scans, error } = await supabaseClient
        .from('attendance_logs')
        .select('*')
        .eq('log_date', schedule.date)
        .not('time_in', 'is', null)
        .order('time_in', { ascending: false })
        .limit(20);

      if (error || !scans) return;

      const schedStart = new Date(schedule.start_time).getTime();
      const schedEnd = new Date(schedule.end_time).getTime();

      const recentScans = scans.filter(scan => {
        const scanTime = new Date(scan.time_in).getTime();
        return scanTime >= schedStart && scanTime <= schedEnd;
      });

      const scanNames = recentScans.map(s => s.name?.toLowerCase());
      const profName = schedule.prof?.toLowerCase();

      if (scanNames.includes(profName)) {
        elements.scanIndicator.className = 'w-3 h-3 rounded-full bg-green-500 inline-block';
        elements.scanLabel.textContent = 'Professor scanned in';
      } else if (recentScans.length > 0) {
        elements.scanIndicator.className = 'w-3 h-3 rounded-full bg-red-500 inline-block';
        elements.scanLabel.textContent = 'Other person(s) scanned';
      } else {
        resetScanIndicator();
      }
    } 
    console.log('Schedule date:', schedule.date);
    console.log('Scans returned:', scans);


  }

  function formatTime(timeStr) {
    const date = new Date(timeStr);
    let hours = date.getHours();
    const minutes = String(date.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'pm' : 'am';
    hours = hours % 12 || 12;
    return `${hours}:${minutes} ${ampm}`;
  }
</script>
</body>
</html>
