<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rooms Table Update</title>
  <link rel="icon" href="/images/favicon.ico" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/0d66da6825.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body class="bg-gray-300 text-gray-700">
  <div class="flex h-screen">
            <!-- Sidebar -->
            <div class="fixed h-full bg-orange-600 group transition-all duration-300 w-16 hover:w-64">
              <div class="flex flex-col h-full">
                  <a href="#" class="flex items-center p-4 border-b border-b-white">
                      <img src="./images/CpELogo.jpg" alt="placeholder" class="w-8 h-8 rounded object-cover">
                      <span class="ml-3 text-lg font-poppins text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                          CpE Department
                      </span>
                  </a>
                  <ul class="flex flex-col mt-4 space-y-2">
                      <li><a href="/Dashboard.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-home text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span></a></li>
                      <li><a href="/Rooms.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-th-large text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Rooms</span></a></li>
                      <li><a href="/Scheduling.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-calendar-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Schedule</span></a></li>
                      <li><a href="/Logs.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-file-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logs</span></a></li>
                  </ul>
              </div>
          </div>
    <!-- Main Content -->
    <div class="flex-1 bg-gray-100 ml-16 p-6">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-orange-600">ROOMS</h1>
      </div>

      <div class="flex space-x-6">
        <!-- Room Buttons -->
        <div class="bg-white shadow-md rounded-lg p-4 w-48">
          <h2 class="text-lg text-orange-500 font-bold mb-4">Rooms in CPE</h2>
          <div class="space-y-2">
            <button onclick="updateRoomStatus('300', event)" class="border px-3 py-2 w-full rounded">ROOM 300</button>
            <button onclick="updateRoomStatus('310', event)" class="border px-3 py-2 w-full rounded">ROOM 310</button>
            <button onclick="updateRoomStatus('311', event)" class="border px-3 py-2 w-full rounded">ROOM 311</button>
            <button onclick="updateRoomStatus('312', event)" class="border px-3 py-2 w-full rounded">ROOM 312</button>
            <button onclick="updateRoomStatus('313', event)" class="border px-3 py-2 w-full rounded">ROOM 313</button>
            <button onclick="updateRoomStatus('314', event)" class="border px-3 py-2 w-full rounded">ROOM 314</button>
            <button onclick="updateRoomStatus('315', event)" class="border px-3 py-2 w-full rounded">ROOM 315</button>
            <button onclick="updateRoomStatus('316', event)" class="border px-3 py-2 w-full rounded">ROOM 316</button>
          </div>
        </div>

        <!-- Room Details BOX -->
        <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-xl">
          <h2 class="text-xl text-orange-500 font-bold mb-4">Room Details</h2>
          <div class="space-y-4">         
            <div class="flex justify-between">
              <span class="font-medium">Room Status</span>
              <span id="room-status" class="font-bold text-gray-800">UNKNOWN</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium">Room Number</span>
              <span id="room-no" class="font-semibold">N/A</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium">Section</span>
              <span id="occupied-by" class="font-semibold">N/A</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium">Subject</span>
              <span id="room-type-details" class="font-semibold">N/A</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium">Professor</span>
              <span id="instructor" class="font-semibold">N/A</span>
            </div>
            <div class="flex justify-between">
              <span class="font-medium">Schedule</span>
              <span id="room-schedule" class="font-semibold">N/A</span>
            </div>
            <div class="flex justify-between items-start">
              <div class="font-medium flex flex-col">
                <span>Scanned In</span>
                <span class="text-xs text-gray-500">*Only available in Room 315</span>
              </div>
              <span id="scan-status" class="font-semibold flex items-center gap-2">
                <span id="scan-indicator" class="w-3 h-3 rounded-full bg-gray-400 inline-block"></span>
                <span id="scan-label">No scan</span>
              </span>
            </div>
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Manual Room Action</label>              
          </div>  
          <div class="relative flex space-x-2">
            <!-- Auto Button -->
            <button onclick="setOverride('auto')" id="btn-auto" class="bg-orange-600 text-white px-5 py-2 rounded-md focus:outline-none">Auto</button>
        
            <!-- Add Schedule Button -->
            <button class="bg-orange-600 text-white px-5 py-2 rounded-md focus:outline-none" onclick="openModal('Add')">Add Schedule</button>
        
            <!-- End Schedule Button -->
            <button class="bg-orange-600 text-white px-5 py-2 rounded-md focus:outline-none" onclick="openModal('End')">End Schedule</button>
        </div>
        
        </div>
      </div>
      

      
    </div>
  </div>
  <script>
    const supabaseClient = supabase.createClient(
      'https://vzubmycafgnjtwnjfpop.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dWJteWNhZmduanR3bmpmcG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNDY2NTQsImV4cCI6MjA1OTkyMjY1NH0.fDzlvR0xT3Sm8BTlCnEbxC8WE8-H3ZBRxA9SeEViaeo'
    );
  
    let manualOverrides = {};
    let currentRoom = null;
  
    function setOverride(value) {
      if (currentRoom) {
        manualOverrides[currentRoom] = value;
        updateRoomStatus(currentRoom);
      }
      highlightSelectedButton(value);
    }
  
    function highlightSelectedButton(value) {
      const buttons = ['auto'];  // Removed 'enter' and 'leave' from the list
      buttons.forEach(v => {
        const btn = document.getElementById('btn-' + v);
        if (btn) {
          btn.classList.toggle('bg-orange-200', v === value);
        }
      });
    }
  
    async function updateRoomStatus(room, event) {
      currentRoom = room;
  
      const roomStatusElement = document.getElementById("room-status");
      const roomNoElement = document.getElementById("room-no");
      const roomTypeElement = document.getElementById("room-type-details");
      const roomScheduleElement = document.getElementById("room-schedule");
      const occupiedByElement = document.getElementById("occupied-by");
      const instructorElement = document.getElementById("instructor");
      const scanIndicator = document.getElementById("scan-indicator");
      const scanLabel = document.getElementById("scan-label");
  
      resetScanIndicator();
  
      document.querySelectorAll("button").forEach(btn => {
        btn.classList.remove("bg-orange-100");
      });
      if (event) event.target.classList.add("bg-orange-100");
  
      roomStatusElement.textContent = 'LOADING...';
      roomStatusElement.style.color = 'gray';
  
      // Highlight selected override button
      syncManualButtons(room);
  
      const { data, error } = await supabaseClient
        .from('schedules_original')
        .select('*')
        .eq('room', room);
  
      if (error) {
        console.error('Error fetching room data:', error);
        roomStatusElement.textContent = 'Error loading schedule';
        roomStatusElement.style.color = 'red';
        return;
      }
  
      const now = new Date();
      const localDate = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Manila' }));
  
      let currentSchedule = null;
  
      for (const schedule of data || []) {
        if (!schedule || !schedule.start_time || !schedule.end_time) continue;
  
        const start = new Date(schedule.start_time).toLocaleString('en-US', { timeZone: 'Asia/Manila' });
        const end = new Date(schedule.end_time).toLocaleString('en-US', { timeZone: 'Asia/Manila' });
  
        const startTime = new Date(start);
        const endTime = new Date(end);
  
        const nowMs = localDate.getTime();
        if (startTime.getTime() <= nowMs && nowMs <= endTime.getTime()) {
          currentSchedule = schedule;
          break;
        }
      }
  
      const override = manualOverrides[room] || 'auto';
  
      if (override === 'auto') {
        if (currentSchedule) {
          updateRoomDisplay('OCCUPIED', 'red', room, currentSchedule);
          if (room === '315') {
            await checkFingerprintScan(currentSchedule);
          }
        } else {
          updateRoomDisplay('AVAILABLE', 'green', room, null);
        }
      }
  
      function updateRoomDisplay(status, color, room, schedule = null) {
        roomStatusElement.textContent = status;
        roomStatusElement.style.color = color;
        roomNoElement.textContent = `ROOM ${room}`;
        roomTypeElement.textContent = schedule?.subject || 'N/A';
        roomScheduleElement.textContent = schedule
          ? `${formatTimeTo12Hour(schedule.start_time)} - ${formatTimeTo12Hour(schedule.end_time)}, ${new Date(schedule.date).toLocaleDateString()}`
          : 'N/A';
        occupiedByElement.textContent = schedule?.section || 'N/A';
        instructorElement.textContent = schedule?.prof || 'N/A';
      }
  
      function resetScanIndicator() {
        scanIndicator.className = 'w-3 h-3 rounded-full bg-gray-400 inline-block';
        scanLabel.textContent = 'No scan';
      }
  
      async function checkFingerprintScan(schedule) {
        try {
          const { data: scans, error } = await supabaseClient
            .from('fingerprint_logsv')
            .select('*')
            .order('timestamp', { ascending: false })
            .limit(10);
  
          if (error || !scans) return;
  
          const nowMs = new Date().getTime();
          const recentScans = scans.filter(scan => {
            const scanTime = new Date(scan.timestamp).getTime();
            return nowMs - scanTime < 30 * 60 * 1000;
          });
  
          const scanNames = recentScans.map(s => s.name.toLowerCase());
          const profName = schedule.prof.toLowerCase();
  
          if (scanNames.includes(profName)) {
            scanIndicator.className = 'w-3 h-3 rounded-full bg-green-500 inline-block';
            scanLabel.textContent = 'Professor scanned in';
          } else if (recentScans.length > 0) {
            scanIndicator.className = 'w-3 h-3 rounded-full bg-red-500 inline-block';
            scanLabel.textContent = 'Other person(s) scanned';
          } else {
            resetScanIndicator();
          }
        } catch (err) {
          console.error('Error checking fingerprint scan:', err);
        }
      }
    }
  
    function syncManualButtons(room) {
      const override = manualOverrides[room] || 'auto';
      highlightSelectedButton(override);
    }
  
    function formatTimeTo12Hour(timeString) {
      const date = new Date(timeString);
      let hours = date.getHours();
      let minutes = date.getMinutes();
      const ampm = hours >= 12 ? 'AM' : 'PM';
      
      hours = hours % 12;
      hours = hours ? hours : 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
  
      return `${hours}:${minutes} ${ampm}`;
    }
  </script>
  
  
  
</body>
</html>
