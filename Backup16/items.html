<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Inventory</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="w-3/4 flex space-x-6">
    <!-- Room buttons -->
      <div class="w-1/4 flex flex-col space-y-4">
      <h1 class="text-2xl font-bold mb-4 text-center">Rooms</h1>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room300">Room 300</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room302">Room 302</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room310">Room 310</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room311">Room 311</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room312">Room 312</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room313">Room 313</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room314">Room 314</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room315">Room 315</button>
      <button class="room-btn bg-blue-500 text-white px-4 py-2 rounded" data-room="Room316">Room 316</button>

    </div>

    <!-- Inventory box -->
    <div class="bg-white p-6 rounded shadow-lg w-3/4 max-w-4xl">
      <h1 class="text-2xl font-bold mb-4 text-center" id="room-title">Inventory for Room 1</h1>
      <div id="inventory" class="space-y-4">
        <!-- Inventory items will appear here -->
      </div>
    </div>
  </div>

  <script>
    // Initialize Supabase
    const supabaseClient = supabase.createClient(
      'https://vzubmycafgnjtwnjfpop.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dWJteWNhZmduanR3bmpmcG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNDY2NTQsImV4cCI6MjA1OTkyMjY1NH0.fDzlvR0xT3Sm8BTlCnEbxC8WE8-H3ZBRxA9SeEViaeo'
    );

    // Map your item keys to table column names
    const items = [
      { key: 'tv', label: 'TVs', column: 'tv_count' },
      { key: 'fan', label: 'Fans', column: 'fan_count' },
      { key: 'chair', label: 'Chairs', column: 'chair_count' },
      { key: 'monoblock', label: 'Monoblocks', column: 'monoblock_count' }
    ];
    let currentRoom = null;
    let counts = {};

    function createInventoryItem(item) {
      const container = document.createElement('div');
      container.className = 'flex items-center justify-between';

      const label = document.createElement('span');
      label.textContent = `${item.label}:`;

      const input = document.createElement('input');
      input.type = 'number';
      input.min = 0;
      input.value = counts[item.key] ?? 0;
      input.className = 'border rounded w-16 text-center';

      input.addEventListener('change', async () => {
        const newCount = parseInt(input.value);
        if (isNaN(newCount) || newCount < 0) {
          input.value = counts[item.key];
          return;
        }
        console.log(`Updating ${item.label} count to ${newCount} for room ${currentRoom}`);
        await updateCount(item, newCount);
      });

      container.appendChild(label);
      container.appendChild(input);

      return container;
    }

    function renderInventory() {
      const container = document.getElementById('inventory');
      container.innerHTML = '';
      items.forEach(item => {
        container.appendChild(createInventoryItem(item));
      });
      document.getElementById('room-title').textContent = `Inventory for ${currentRoom}`;
    }

    async function updateCount(item, newCount) {
      if (newCount < 0) return;

      counts[item.key] = newCount;

      // Prepare update object dynamically
      const updateData = {};
      updateData[item.column] = newCount;

      // Upsert: if no row exists, create it; else update existing
      const { data, error } = await supabaseClient
        .from('room_inventory2')
        .upsert([{ room: currentRoom, ...updateData }], { onConflict: 'room' });

      if (error) {
        console.error('Error updating inventory:', error);
      } else {
        console.log(`Updated ${item.label} count to ${newCount} in ${currentRoom}`);
      }
    }

    async function loadRoom(room) {
      currentRoom = room;
      counts = {};

      // Highlight active room button
      document.querySelectorAll('.room-btn').forEach(btn => {
        btn.classList.toggle('bg-blue-700', btn.dataset.room === room);
        btn.classList.toggle('bg-blue-500', btn.dataset.room !== room);
      });

      // Fetch inventory for the room
      const { data, error } = await supabaseClient
        .from('room_inventory2')
        .select('*')
        .eq('room', room)
        .single();

      if (error && error.code !== 'PGRST116') {
        console.error('Error loading room inventory:', error);
        return;
      }

      if (data) {
        items.forEach(item => {
          counts[item.key] = data[item.column] ?? 0;
        });
      } else {
        // No data yet, initialize counts to 0
        items.forEach(item => {
          counts[item.key] = 0;
        });
      }

      renderInventory();
    }

    document.querySelectorAll('.room-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        loadRoom(btn.dataset.room);
      });
    });

    // Load default room on page load
    loadRoom('Room1');
  </script>
</body>
</html>
