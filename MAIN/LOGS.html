<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Schedule</title>
  <link rel="icon" href="/images/favicon.ico" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://kit.fontawesome.com/0d66da6825.js" crossorigin="anonymous"></script>
</head>
<body class="bg-white text-black">

  <div class="flex">
    <!-- Sidebar -->
    <div class="fixed h-full bg-orange-600 group transition-all duration-300 w-16 hover:w-64">
        <div class="flex flex-col h-full">
            <a href="#" class="flex items-center p-4 border-b border-b-white">
              <img src="/images/CpELogo.jpg" alt="placeholder" class="w-8 h-8 rounded object-cover">
                <span class="ml-3 text-lg font-poppins text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    CpE Department
                </span>
            </a>
            <ul class="flex flex-col mt-4 space-y-2">
              <li><a href="/MAIN/INDEX.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-home text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span></a></li>
              <li><a href="/MAIN/ROOMS.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-th-large text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Rooms</span></a></li>
              <li><a href="/MAIN/SCHEDULES.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-calendar-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Schedule</span></a></li>
              <li><a href="/MAIN/LOGS.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-file-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logs</span></a></li>
          </ul>
        </div>
    </div>

    <!-- Main content -->
    <div class="flex-1 ml-16 lg:ml-25 p-6 overflow-x-auto">
      <div class="mb-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-orange-600">Schedule logs</h1>
        <button onclick="window.print()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">
          Print This Page
        </button>
      </div>

      <div class="mb-4 flex flex-wrap gap-4">
        <select id="filter-room" class="border p-2 rounded">
          <option value="">All Rooms</option>
        </select>
        <select id="filter-professor" class="border p-2 rounded">
          <option value="">All Professors</option>
        </select>
        <!-- <select id="filter-time" class="border p-2 rounded">
          <option value="">All Times</option>
        </select> -->
        <select id="filter-section" class="border p-2 rounded">
            <option value="">Sections</option>
          </select>
      </div>
      

      <div id="schedule-table" class="overflow-x-auto shadow-md border border-gray-300 rounded-lg"></div>
    </div>
  </div>

<!--Filter schedules code-->
<script src="/MAIN/script.js"></script>
</body>
</html>
