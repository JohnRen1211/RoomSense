<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Schedule</title>
  <link rel="icon" href="/images/favicon.ico" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://kit.fontawesome.com/0d66da6825.js" crossorigin="anonymous"></script>
</head>
<body class="bg-white text-black">

<div class="flex">
  <!-- Sidebar -->
  <div class="fixed h-full bg-orange-600 group transition-all duration-300 w-16 hover:w-64">
    <div class="flex flex-col h-full">
      <a href="#" class="flex items-center p-4 border-b border-b-white">
        <img src="./images/CpELogo.jpg" alt="placeholder" class="w-8 h-8 rounded object-cover">
        <span class="ml-3 text-lg font-poppins text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          CpE Department
        </span>
      </a>
      <ul class="flex flex-col mt-4 space-y-2">
        <li><a href="/Mainpage.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-home text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span></a></li>
        <li><a href="/Rooms.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-th-large text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Rooms</span></a></li>
        <li><a href="/SCHEDULES.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-calendar-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Schedule</span></a></li>
        <li><a href="/Logs.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-file-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logs</span></a></li>
      </ul>
    </div>
  </div>

  <!-- Main content -->
  <div class="flex-1 ml-16 lg:ml-64 p-6">
    <div class="mb-6 flex justify-between items-center">
      <h1 class="text-3xl font-bold text-orange-600">Schedule logs</h1>
      <button onclick="window.print()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">
        Print This Page
      </button>
    </div>

    <div class="mb-4 flex flex-wrap gap-4">
      <select id="filter-room" class="border p-2 rounded">
        <option value="">All Rooms</option>
      </select>
      <select id="filter-professor" class="border p-2 rounded">
        <option value="">All Professors</option>
      </select>
      <select id="filter-time" class="border p-2 rounded">
        <option value="">All Times</option>
      </select>
    </div>

    <!-- Original Schedule -->
    <div id="schedule-table" class="overflow-x-auto shadow-md border border-gray-300 rounded-lg mb-8"></div>

    <!-- Manual Schedule -->
    <div id="manual-schedule-table" class="overflow-x-auto shadow-md border border-gray-300 rounded-lg"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://vzubmycafgnjtwnjfpop.supabase.co';
  const SUPABASE_API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dWJteWNhZmduanR3bmpmcG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNDY2NTQsImV4cCI6MjA1OTkyMjY1NH0.fDzlvR0xT3Sm8BTlCnEbxC8WE8-H3ZBRxA9SeEViaeo'; // Truncated for brevity
  const TABLE_ORIGINAL = 'schedules_original';
  const TABLE_MANUAL = 'schedules_manual';

  let originalData = [];
  let manualData = [];

  async function loadAllSchedules() {
    try {
      const [originalRes, manualRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/${TABLE_ORIGINAL}?select=*`, {
          headers: {
            'apikey': SUPABASE_API_KEY,
            'Authorization': `Bearer ${SUPABASE_API_KEY}`
          }
        }),
        fetch(`${SUPABASE_URL}/rest/v1/${TABLE_MANUAL}?select=*`, {
          headers: {
            'apikey': SUPABASE_API_KEY,
            'Authorization': `Bearer ${SUPABASE_API_KEY}`
          }
        })
      ]);

      if (!originalRes.ok || !manualRes.ok) throw new Error("Failed to load schedule data.");

      originalData = await originalRes.json();
      manualData = await manualRes.json();

      populateFilters([...originalData, ...manualData]);
const combinedSorted = [...originalData, ...manualData].sort((a, b) => {
  const dateA = new Date(a.date || a.created_at || 0);
  const dateB = new Date(b.date || b.created_at || 0);

  const timeA = new Date(a.start_time || a.time || 0);
  const timeB = new Date(b.start_time || b.time || 0);

  return dateA - dateB || timeA - timeB;
});

renderSchedule(combinedSorted);

    } catch (err) {
      console.error("Error loading schedules:", err.message);
      document.getElementById("schedule-table").innerHTML = `<p class="text-red-600">Failed to load schedules.</p>`;
    }
  }

  function populateFilters(allSchedules) {
    const roomSet = new Set();
    const profSet = new Set();
    const timeSet = new Set();

    allSchedules.forEach(s => {
      if (s.room) roomSet.add(s.room);
      if (s.prof) profSet.add(s.prof);
      if (s.start_time && s.end_time) {
        const time = `${new Date(s.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${new Date(s.end_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        timeSet.add(time);
      } else if (s.time) {
        timeSet.add(s.time); // fallback for `time` field
      }
    });

    const roomSelect = document.getElementById("filter-room");
    const profSelect = document.getElementById("filter-professor");
    const timeSelect = document.getElementById("filter-time");

    roomSet.forEach(room => roomSelect.innerHTML += `<option value="${room}">${room}</option>`);
    profSet.forEach(prof => profSelect.innerHTML += `<option value="${prof}">${prof}</option>`);
    timeSet.forEach(time => timeSelect.innerHTML += `<option value="${time}">${time}</option>`);

    [roomSelect, profSelect, timeSelect].forEach(select => {
      select.addEventListener("change", applyFilters);
    });
  }

  function applyFilters() {
    const selectedRoom = document.getElementById("filter-room").value;
    const selectedProf = document.getElementById("filter-professor").value;
    const selectedTime = document.getElementById("filter-time").value;

    const combined = [...originalData, ...manualData];

    const filtered = combined.filter(s => {
      const matchRoom = !selectedRoom || s.room === selectedRoom;
      const matchProf = !selectedProf || s.prof === selectedProf;
      const scheduleTime = s.start_time && s.end_time
        ? `${new Date(s.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${new Date(s.end_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`
        : s.time || '';
      const matchTime = !selectedTime || scheduleTime === selectedTime;

      return matchRoom && matchProf && matchTime;
    });

const filteredSorted = filtered.sort((a, b) => {
  const dateA = new Date(a.date || a.created_at || 0);
  const dateB = new Date(b.date || b.created_at || 0);

  const timeA = new Date(a.start_time || a.time || 0);
  const timeB = new Date(b.start_time || b.time || 0);

  return dateA - dateB || timeA - timeB;
});

renderSchedule(filteredSorted);

  }

  function renderSchedule(schedules) {
    const container = document.getElementById("schedule-table");

    if (schedules.length === 0) {
      container.innerHTML = `
        <table class="min-w-full text-sm text-left border-collapse">
          <tr>
            <td colspan="5" class="px-4 py-2 text-center text-gray-500 border">No schedule found for this room.</td>
          </tr>
        </table>`;
      return;
    }

    const html = `
      <table class="min-w-full text-sm text-left border-collapse">
        <thead class="bg-orange-500 text-white">
          <tr>
            <th class="px-4 py-2 border">Date</th>
            <th class="px-4 py-2 border">Time</th>
            <th class="px-4 py-2 border">Subject</th>
            <th class="px-4 py-2 border">Instructor</th>
            <th class="px-4 py-2 border">Section</th>
          </tr>
        </thead>
        <tbody>
          ${schedules.map(schedule => {
            const date = schedule.date ? new Date(schedule.date).toLocaleDateString() : '-';
            const startTime = schedule.start_time ? new Date(schedule.start_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true}) : '';
            const endTime = schedule.end_time ? new Date(schedule.end_time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: true}) : '';
            const time = startTime && endTime ? `${startTime} - ${endTime}` : (schedule.time || '-');

            return `
              <tr class="border-t">
                <td class="px-4 py-2 border">${date}</td>
                <td class="px-4 py-2 border">${time}</td>
                <td class="px-4 py-2 border">${schedule.subject || '-'}</td>
                <td class="px-4 py-2 border">${schedule.prof || '-'}</td>
                <td class="px-4 py-2 border">${schedule.section || '-'}</td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;

    container.innerHTML = html;
  }

  loadAllSchedules();
</script>


</body>
</html>
