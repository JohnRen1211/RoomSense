        let currentRoomId = null;
        
        function getCurrentSchedule(roomId) {
          const room = roomDetails[roomId];
          if (!room || !room.schedule) return null;

          const now = new Date();
          const currentDay = now.toLocaleString('en-US', { weekday: 'long' });
          const currentTime = now.getHours() * 60 + now.getMinutes(); // Convert to minutes for comparison

          for (const session of room.schedule) {
            if (session.day === currentDay) {
              const [start, end] = session.time.split(" - ").map(t => convertToMinutes(t));
              if (currentTime >= start && currentTime <= end) {
                return session;
              }
            }
          }
          return null;
        }

        function convertToMinutes(timeStr) {
          const [time, modifier] = timeStr.split(" ");
          let [hours, minutes] = time.split(":").map(Number);

          if (modifier === "PM" && hours !== 12) hours += 12;
          if (modifier === "AM" && hours === 12) hours = 0;

          return hours * 60 + minutes;
        }

        function updateRoomStatus(roomId) {
          const room = roomDetails[roomId];
          // room.status = room.population > 0 ? "OCCUPIED" : "AVAILABLE";
          const roomButton = document.querySelector(`.toggle-button[data-room-id="${roomId}"]`);

          // Update button color based on status
          updateButtonColor(roomButton, room.status);

          showDescription(roomId);
        }

        function showDescription(roomId) {
          const room = roomDetails[roomId];
          const currentSession = getCurrentSchedule(roomId);

          if (currentSession) {
            room.status = "OCCUPIED";
            room.occupiedBy = currentSession.section;
            room.instructor = currentSession.instructor;
            room.subject = currentSession.subject;
          } else {
            room.status = "AVAILABLE";
            room.occupiedBy = "-";
            room.instructor = "-";
            room.subject = "-";
          }

          // Update button color again to ensure correct state
          const roomButton = document.querySelector(`.toggle-button[data-room-id="${roomId}"]`);
          updateButtonColor(roomButton, room.status);

          document.getElementById('roomName').innerHTML = `
            <h2 class="text-2xl font-bold text-orange-500 text-center border-b-2 border-gray-300 pb-2">
              Room ${room.roomNumber} (${room.roomType})
            </h2>
          `;
          const descriptionHTML = `
          <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-orange-500">Room Status</h2>
            <div id="roomStatus" class="text-${room.status === "OCCUPIED" ? 'red' : 'green'}-500 font-bold text-2xl pr-20">
              ${room.status}
              <p class="font-extralight text-gray-400 text-sm">Fingerprint not verified</p>
            </div>
          </div>
          <div class="text-base mb-2"><strong>Room no.:</strong> ${room.roomNumber}</div>
          <div class="text-base mb-2"><strong>Room Type:</strong> ${room.roomType}</div>
          <div class="text-base mb-2"><strong>Occupied by:</strong> ${room.occupiedBy}</div>
          <div class="text-base mb-2"><strong>Instructor:</strong> ${room.instructor}</div>
          <div class="text-base mb-2"><strong>Subject:</strong> ${room.subject}</div>
        `;  
          document.getElementById('roomDesc').innerHTML = descriptionHTML;

          currentRoomId = roomId;
        }

        function updateButtonColor(button, status) {
          if (!button) return;
          if (status === "OCCUPIED") {
            button.classList.remove('bg-green-500');
            button.classList.add('bg-red-500');
          } else {
            button.classList.remove('bg-red-500');
            button.classList.add('bg-green-500');
          }
        }


        document.querySelectorAll('.toggle-button').forEach(button => {
          button.addEventListener('click', () => {
            const roomId = button.getAttribute('data-room-id');
            fetchPeopleCount(roomId);
          });
