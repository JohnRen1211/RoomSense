<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firestore Auto Collection</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
</head>
<body>
    <h2>Firestore Data Test</h2>

    <input type="text" id="name" placeholder="Enter Name">
    <button onclick="saveData()">Save to Firestore</button>

    <h3>Saved Data:</h3>
    <ul id="dataList"></ul>

    <script>
        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAhbszJ57KzatrTX9RTgqhqjtbiNl62-os",
            authDomain: "scheduleproto-66833.firebaseapp.com",
            databaseURL: "https://scheduleproto-66833-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "scheduleproto-66833",
            storageBucket: "scheduleproto-66833.firebasestorage.app",
            messagingSenderId: "493729674831",
            appId: "1:493729674831:web:ea06a43481a19469eadc3a"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const collectionName = "users"; // Change this if needed

        // Function to save data
        function saveData() {
            const name = document.getElementById("name").value;
            if (name.trim() === "") {
                alert("Enter a name first!");
                return;
            }

            db.collection(collectionName).add({
                name: name,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Data added successfully!");
                document.getElementById("name").value = "";
            })
            .catch(error => console.error("Error adding data:", error));
        }

        // Function to listen for real-time updates
        function loadData() {
            const dataList = document.getElementById("dataList");
            db.collection(collectionName).orderBy("timestamp", "desc")
                .onSnapshot(snapshot => {
                    dataList.innerHTML = ""; // Clear list
                    snapshot.forEach(doc => {
                        const li = document.createElement("li");
                        li.textContent = doc.data().name;
                        dataList.appendChild(li);
                    });
                });
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
