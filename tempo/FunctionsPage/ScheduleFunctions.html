<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Scripts for Schedule page-->>
    <script>
        // Dropdown menu toggle function
        function toggleDropdown() {
            // Get the dropdown menu element by its ID
            let dropdown = document.getElementById("dropdownMenu");
            // Toggle the "hidden" class, which controls the visibility of the dropdown
            dropdown.classList.toggle("hidden");
    
            // If the dropdown is not hidden, make it visible with animation
            if (!dropdown.classList.contains("hidden")) {
                dropdown.classList.remove("opacity-0", "scale-95");
                dropdown.classList.add("opacity-100", "scale-100");
            } else {
                // If it is hidden, apply the "hidden" class and hide it with animation
                dropdown.classList.remove("opacity-100", "scale-100");
                dropdown.classList.add("opacity-0", "scale-95");
            }
        }
    
        // Close the dropdown if the user clicks outside of it
        document.addEventListener("click", function (event) {
            let dropdown = document.getElementById("dropdownMenu");
            let button = document.querySelector("button[onclick='toggleDropdown()']");
            // If the clicked target is not the dropdown or the button that opens it, hide the dropdown
            if (!dropdown.contains(event.target) && !button.contains(event.target)) {
                dropdown.classList.add("hidden");
            }
        });
    
        // Function to open the modal (Add or Edit schedule)
        function openModal(mode = 'Add') {
            // Remove the "hidden" class to show the modal
            document.getElementById("modal").classList.remove("hidden");
    
            // If the mode is 'Add', reset the form and clear any existing schedule
            if (mode === 'Add') {
              currentSchedule = null;
              document.getElementById("scheduleForm").reset(); // Reset the form for a new entry
            }
        }
    
        // Function to close the modal
        function closeModal() {
            // Add the "hidden" class to hide the modal
            document.getElementById("modal").classList.add("hidden");
            currentSchedule = null;
            // Reset the schedule form when the modal is closed
            document.getElementById("scheduleForm").reset();
        }
    
        // Apply day filter to the schedule
        function applyDayFilter() {
            let selectedRoom = document.getElementById("room-title").textContent;
            // Only update the schedule if a room is selected
            if (selectedRoom !== "Select a room") {
                updateSchedule(selectedRoom);
            }
        }
    
        // Constants for Supabase (database API)
        const SUPABASE_URL = 'https://vzubmycafgnjtwnjfpop.supabase.co';
        const SUPABASE_API_KEY = 'YOUR_SUPABASE_API_KEY';
        const TABLE_NAME = 'schedules';
    
        let currentSchedule = null; // Track editing state (whether we are editing an existing schedule)
    
        // Save schedule function (either for adding a new one or editing an existing one)
        async function saveSchedule(event) {
            event?.preventDefault?.(); // Prevent the default form submission if there is an event
    
            // Get the values from the form inputs
            let room = document.getElementById("room").value.trim();
            let day = document.getElementById("day").value.trim();
            let time = document.getElementById("time").value.trim();
            let section = document.getElementById("section").value.trim();
            let subject = document.getElementById("subject").value.trim();
            let prof = document.getElementById("prof").value.trim();
    
            // If any field is empty, show an alert and exit
            if (!room || !day || !time || !section || !subject || !prof) {
                alert("Please fill in all fields before saving.");
                return;
            }
    
            // Disable the submit button while the request is being processed
            const submitButton = document.getElementById("submitButton");
            if (submitButton) submitButton.disabled = true;
    
            try {
                // Determine if we're editing an existing schedule
                const isEditing = currentSchedule !== null;
                const method = isEditing ? 'PUT' : 'POST';
                const url = isEditing
                    ? `${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.${currentSchedule.id}` // Update an existing schedule
                    : `${SUPABASE_URL}/rest/v1/${TABLE_NAME}`; // Add a new schedule
    
                // Send the request to the API
                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_API_KEY,
                        'Authorization': `Bearer ${SUPABASE_API_KEY}`,
                        'Prefer': 'return=representation' // Request that the updated or added data is returned
                    },
                    body: JSON.stringify({ room, day, time, section, subject, prof })
                });
    
                // If the response is not OK, throw an error
                if (!response.ok) throw new Error(await response.text());
    
                // Notify the user whether the schedule was saved or updated successfully
                alert(isEditing ? "Schedule updated!" : "Schedule saved!");
                closeModal();
                currentSchedule = null;
                updateSchedule(room); // Update the displayed schedule after saving
    
            } catch (err) {
                // Handle any errors that occur during the save process
                console.error("Save error:", err.message);
                alert("Failed: " + err.message);
            } finally {
                // Re-enable the submit button
                if (submitButton) submitButton.disabled = false;
            }
        }
    
        // Function to update the schedule displayed on the page
        async function updateSchedule(room) {
            // Update the title of the room being viewed
            document.getElementById("room-title").textContent = room;
            let dayFilter = document.getElementById("dayFilter").value; // Get the selected day filter
    
            try {
                // Fetch the schedule data from the database for the selected room
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?room=eq.${room}&select=*`, {
                    headers: {
                        'apikey': SUPABASE_API_KEY,
                        'Authorization': `Bearer ${SUPABASE_API_KEY}`
                    }
                });
    
                if (!response.ok) throw new Error(await response.text());
    
                // Filter the schedule data based on the selected day filter
                let scheduleData = await response.json();
                let filteredSchedules = scheduleData.filter(s => dayFilter === "" || s.day === dayFilter);
    
                // Generate the HTML table for the schedule
                let table = `<table class='w-full border-collapse border border-gray-400 mt-4'>
                    <thead>
                        <tr class='bg-orange-500 text-white'>
                            <th class='border border-gray-400 px-4 py-2'>Instructor</th>
                            <th class='border border-gray-400 px-4 py-2'>Day</th>
                            <th class='border border-gray-400 px-4 py-2'>Time</th>
                            <th class='border border-gray-400 px-4 py-2'>Section</th>
                            <th class='border border-gray-400 px-4 py-2'>Subject</th>
                            <th class='border border-gray-400 px-4 py-2'>Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;
    
                if (filteredSchedules.length > 0) {
                    filteredSchedules.forEach((s) => {
                        table += `<tr>
                            <td class='border border-gray-400 px-4 py-2'>${s.prof}</td>
                            <td class='border border-gray-400 px-4 py-2'>${s.day}</td>
                            <td class='border border-gray-400 px-4 py-2'>${s.time}</td>
                            <td class='border border-gray-400 px-4 py-2'>${s.section}</td>
                            <td class='border border-gray-400 px-4 py-2'>${s.subject}</td>
                            <td class='border border-gray-400 px-4 py-2'>
                                <button onclick='editSchedule(${JSON.stringify(s)})' class='text-blue-600 underline mr-2'>Edit</button>
                                <button onclick='deleteSchedule(${s.id}, "${room}")' class='text-red-600 underline'>Delete</button>
                            </td>
                        </tr>`;
                    });
                } else {
                    table += `<tr>
                        <td colspan='6' class='border border-gray-400 px-4 py-2 text-center text-red-500'>No schedule available</td>
                    </tr>`;
                }
    
                table += `</tbody></table>`;
                // Insert the generated table into the page
                document.getElementById("room-schedule").innerHTML =
                    `<h2 id="room-title" class="text-center text-xl font-bold text-orange-600 mb-4">${room}</h2>` + table;
    
            } catch (err) {
                // Handle any errors that occur during the schedule fetch
                console.error("Error fetching schedule:", err.message);
                alert("Error loading schedule: " + err.message);
            }
        }
    
        // Function to edit a schedule
        function editSchedule(schedule) {
            currentSchedule = schedule; // Set the current schedule being edited
            // Pre-fill the form with the schedule data
            document.getElementById("room").value = schedule.room;
            document.getElementById("day").value = schedule.day;
            document.getElementById("time").value = schedule.time;
            document.getElementById("section").value = schedule.section;
            document.getElementById("subject").value = schedule.subject;
            document.getElementById("prof").value = schedule.prof;
            openModal(); // Open the modal to edit
        }
    
        // Function to delete a schedule
        async function deleteSchedule(id, room) {
            const confirmed = confirm("Are you sure you want to delete this schedule?");
            if (!confirmed) return;
    
            try {
                // Send the DELETE request to remove the schedule
                const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_API_KEY,
                        'Authorization': `Bearer ${SUPABASE_API_KEY}`
                    }
                });
    
                if (!response.ok) throw new Error(await response.text());
    
                // Notify the user and update the schedule list
                alert("Schedule deleted.");
                updateSchedule(room);
            } catch (err) {
                console.error("Delete error:", err.message);
                alert("Delete failed: " + err.message);
            }
        }
    </script>
    

    
</body>
</html>
