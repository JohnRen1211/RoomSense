<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Print Schedule</title>
  <link rel="icon" href="/images/favicon.ico" type="image/svg+xml">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <script src="https://kit.fontawesome.com/0d66da6825.js" crossorigin="anonymous"></script>
</head>
<body class="bg-white text-black">

  <div class="flex">
    <!-- Sidebar -->
    <div class="fixed h-full bg-orange-600 group transition-all duration-300 w-16 hover:w-64">
        <div class="flex flex-col h-full">
            <a href="#" class="flex items-center p-4 border-b border-b-white">
              <img src="/images/CpELogo.jpg" alt="placeholder" class="w-8 h-8 rounded object-cover">
                <span class="ml-3 text-lg font-poppins text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    CpE Department
                </span>
            </a>
            <ul class="flex flex-col mt-4 space-y-2">
              <li><a href="index.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-home text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span></a></li>
              <li><a href="ROOMS.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-th-large text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Rooms</span></a></li>
              <li><a href="SCHEDULES.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-calendar-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Schedule</span></a></li>
              <li><a href="LOGS.html" class="flex items-center px-4 py-2 text-white rounded-md hover:bg-orange-500 transition-all duration-300"><i class="fas fa-file-alt text-2xl"></i><span class="ml-3 text-lg font-poppins opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Logs</span></a></li>
          </ul>
        </div>
    </div>

    <!-- Main content -->
    <div class="flex-1 ml-16 lg:ml-64 p-6">
      <div class="mb-6 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-orange-600">Schedule logs</h1>
        <button onclick="window.print()" class="bg-orange-600 text-white px-4 py-2 rounded hover:bg-orange-700">
          Print This Page
        </button>
      </div>

      <div class="mb-4 flex flex-wrap gap-4">
        <select id="filter-room" class="border p-2 rounded">
          <option value="">All Rooms</option>
        </select>
        <select id="filter-professor" class="border p-2 rounded">
          <option value="">All Professors</option>
        </select>
        <!-- <select id="filter-time" class="border p-2 rounded">
          <option value="">All Times</option>
        </select> -->
        <select id="filter-section" class="border p-2 rounded">
            <option value="">Sections</option>
          </select>
      </div>
      

      <div id="schedule-table" class="overflow-x-auto shadow-md border border-gray-300 rounded-lg"></div>
    </div>
  </div>

<!--Filter schedules code-->
  <script>
    const SUPABASE_URL = 'https://vzubmycafgnjtwnjfpop.supabase.co';
    const SUPABASE_API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6dWJteWNhZmduanR3bmpmcG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQzNDY2NTQsImV4cCI6MjA1OTkyMjY1NH0.fDzlvR0xT3Sm8BTlCnEbxC8WE8-H3ZBRxA9SeEViaeo';
    const TABLE_NAME = 'schedules_test';
    let allSchedules = [];
  
    async function loadAllSchedules() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?select=*`, {
          headers: {
            'apikey': SUPABASE_API_KEY,
            'Authorization': `Bearer ${SUPABASE_API_KEY}`
          }
        });
  
        if (!response.ok) throw new Error(await response.text());
  
        allSchedules = await response.json(); // Store for filtering
  
        populateFilters();
        renderSchedule(allSchedules);
  
      } catch (err) {
        console.error("Error loading schedules:", err.message);
        document.getElementById("schedule-table").innerHTML = `<p class="text-red-600">Failed to load schedules.</p>`;
      }
    }
  
    function populateFilters() {
  const roomSet = new Set();
  const profSet = new Set();
  const sectionSet = new Set();

  allSchedules.forEach(s => {
    if (s.room) roomSet.add(s.room);
    if (s.prof) profSet.add(s.prof);
    if (s.section) sectionSet.add(s.section);
  });

  const roomSelect = document.getElementById("filter-room");
  const profSelect = document.getElementById("filter-professor");
  const sectionSelect = document.getElementById("filter-section");

  roomSet.forEach(room => roomSelect.innerHTML += `<option value="${room}">${room}</option>`);
  profSet.forEach(prof => profSelect.innerHTML += `<option value="${prof}">${prof}</option>`);
  sectionSet.forEach(section => sectionSelect.innerHTML += `<option value="${section}">${section}</option>`);

  [roomSelect, profSelect, sectionSelect].forEach(select => {
    select.addEventListener("change", applyFilters);
  });
}

function applyFilters() {
  const selectedRoom = document.getElementById("filter-room").value;
  const selectedProf = document.getElementById("filter-professor").value;
  const selectedSection = document.getElementById("filter-section").value;

  const filtered = allSchedules.filter(s => {
    return (!selectedRoom || s.room === selectedRoom) &&
           (!selectedProf || s.prof === selectedProf) &&
           (!selectedSection || s.section === selectedSection);
  });

  renderSchedule(filtered);
}

function formatTimeRange(start, end) {
  const options = { hour: '2-digit', minute: '2-digit' };
  const startFormatted = new Date(start).toLocaleTimeString([], options);
  const endFormatted = new Date(end).toLocaleTimeString([], options);
  return `${startFormatted} - ${endFormatted}`;
}

function renderSchedule(schedules) {
  if (schedules.length === 0) {
    document.getElementById("schedule-table").innerHTML = "<p class='text-gray-500 p-4'>No schedules match the selected filters.</p>";
    return;
  }

  let html = `
    <table class="min-w-full text-sm text-left border-collapse">
      <thead class="bg-orange-500 text-white">
        <tr>
          <th class="px-4 py-2 border">Room</th>
          <th class="px-4 py-2 border">Instructor</th>
          <th class="px-4 py-2 border">Subject</th>
          <th class="px-4 py-2 border">Section</th>
          <th class="px-4 py-2 border">Date</th>
          <th class="px-4 py-2 border">Time</th>
          <th class="px-4 py-2 border">Semester</th>
        </tr>
      </thead>
      <tbody>
  `;

  schedules.forEach(s => {
    html += `
      <tr class="border-t">
        <td class="px-4 py-2 border">${s.room || '-'}</td>
        <td class="px-4 py-2 border">${s.prof || '-'}</td>
        <td class="px-4 py-2 border">${s.subject || '-'}</td>
        <td class="px-4 py-2 border">${s.section || '-'}</td>
        <td class="px-4 py-2 border">${s.date || '-'}</td>
        <td class="px-4 py-2 border">${formatTimeRange(s.start_time, s.end_time)}</td>
        <td class="px-4 py-2 border">${s.semester || '-'}</td>
      </tr>
    `;
  });

  html += `</tbody></table>`;
  document.getElementById("schedule-table").innerHTML = html;
}

  
    loadAllSchedules();
  </script>
  
</body>
</html>
